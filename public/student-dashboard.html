<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard — CampusFlow AI</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-layout">
    <!-- Sidebar dynamically inserted by app.js -->
    <div id="sidebar-container"></div>

    <div class="main-content">
      <!-- Topbar dynamically inserted by app.js -->
      <div id="topbar-container"></div>

      <main class="page-content">
        <!-- Verification Banner (shown if not verified) -->
        <div id="verification-banner" style="display:none;"></div>

        <!-- Welcome Header -->
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:24px;">
          <div>
            <h1 id="welcome-heading">Welcome</h1>
            <p id="welcome-sub" style="color:var(--text-secondary);font-size:.9rem;"></p>
          </div>
          <div>
            <a href="/create-application.html" id="btn-create-app" class="btn btn-primary btn-lg">
              ✏️ Create New Application
            </a>
          </div>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon blue">📋</div>
            <div class="stat-info">
              <div class="stat-value" id="stat-total">0</div>
              <div class="stat-label">Total Applications</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon amber">⏳</div>
            <div class="stat-info">
              <div class="stat-value" id="stat-pending">0</div>
              <div class="stat-label">Pending Review</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon green">✅</div>
            <div class="stat-info">
              <div class="stat-value" id="stat-approved">0</div>
              <div class="stat-label">Approved</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon red">❌</div>
            <div class="stat-info">
              <div class="stat-value" id="stat-rejected">0</div>
              <div class="stat-label">Rejected</div>
            </div>
          </div>
        </div>

        <!-- Recent Applications Card -->
        <div class="card">
          <div class="card-header">
            <span>Recent Applications</span>
            <a href="/my-applications.html" class="btn btn-sm btn-outline">View All</a>
          </div>
          <div class="card-body" style="padding:0;">
            <div class="table-container">
              <table id="applications-table">
                <thead>
                  <tr>
                    <th>Application ID</th>
                    <th>Category</th>
                    <th>Subject</th>
                    <th>Recipient Authority</th>
                    <th>Submitted On</th>
                    <th>Status</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="applications-body">
                  <tr>
                    <td colspan="7" style="text-align:center;padding:30px;">
                      <div class="spinner"></div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Require student/cr role
      const user = await Auth.requireStudentPanel();
      if (!user) return;

      // 2. Setup sidebar and topbar
      document.getElementById('sidebar-container').innerHTML = UI.buildStudentSidebar(user);
      document.getElementById('topbar-container').innerHTML = UI.buildTopbar('Student Dashboard');
      UI.setupPage(user, 'student-dashboard');

      // 3. Welcome banner
      document.getElementById('welcome-heading').textContent = `Welcome, ${user.full_name}`;
      const roleText = user.role === 'cr' ? 'Class Representative (CR)' : 'Student';
      document.getElementById('welcome-sub').textContent =
        `${roleText} • Roll No: ${user.roll_number || 'N/A'} • ${user.course || 'B.Tech'} ${user.department_name || ''} (Sem ${user.semester || 1}, Sec ${user.section || 'A'})`;

      // 4. Verification check
      const banner = document.getElementById('verification-banner');
      const createBtn = document.getElementById('btn-create-app');

      if (user.verification_status === 'pending_verification') {
        banner.className = 'alert alert-warning';
        banner.innerHTML = `
          <div style="font-size:1.4rem;">⏳</div>
          <div>
            <strong>Account Pending Verification:</strong> Your registration is currently undergoing manual verification by institutional administrators.
            You may browse your dashboard and past records, but <strong>new application submission is temporarily locked</strong> until your university roll number and identity are verified.
          </div>
        `;
        banner.style.display = 'flex';
        createBtn.classList.add('disabled');
        createBtn.style.pointerEvents = 'none';
        createBtn.style.opacity = '0.5';
        createBtn.title = 'Account must be verified before submitting applications.';
      } else if (user.verification_status === 'rejected') {
        banner.className = 'alert alert-danger';
        banner.innerHTML = `
          <div style="font-size:1.4rem;">❌</div>
          <div>
            <strong>Account Verification Rejected:</strong> Your account registration was not approved. Remarks: "<em>${UI.escapeHtml(user.verification_remarks || 'Identity details could not be validated.')}</em>". Please contact the academic administration office.
          </div>
        `;
        banner.style.display = 'flex';
        createBtn.style.display = 'none';
      } else if (user.verification_status === 'suspended') {
        banner.className = 'alert alert-danger';
        banner.innerHTML = `
          <div style="font-size:1.4rem;">🚫</div>
          <div><strong>Account Suspended:</strong> This account has been suspended by campus administration.</div>
        `;
        banner.style.display = 'flex';
        createBtn.style.display = 'none';
      }

      // If user is CR, highlight collective privileges
      if (user.role === 'cr') {
        const crNotice = document.createElement('div');
        crNotice.className = 'alert alert-info';
        crNotice.style.marginTop = '12px';
        crNotice.innerHTML = `
          <div style="font-size:1.3rem;">🏷️</div>
          <div><strong>Class Representative Privileges Active:</strong> You are authorized to draft both <em>Individual Student Applications</em> and <em>Collective Class Applications</em> representing your enrolled batch.</div>
        `;
        banner.parentNode.insertBefore(crNotice, banner.nextSibling);
      }

      // 5. Load Stats
      try {
        const statsRes = await API.get('/api/student/stats');
        if (statsRes.success && statsRes.stats) {
          document.getElementById('stat-total').textContent = statsRes.stats.total;
          document.getElementById('stat-pending').textContent = statsRes.stats.pending;
          document.getElementById('stat-approved').textContent = statsRes.stats.approved;
          document.getElementById('stat-rejected').textContent = statsRes.stats.rejected;
        }
      } catch (err) {
        console.error('Failed to load stats', err);
      }

      // 6. Load Recent Applications
      try {
        const appsRes = await API.get('/api/student/applications');
        const tbody = document.getElementById('applications-body');

        if (appsRes.success && appsRes.applications && appsRes.applications.length > 0) {
          const recent = appsRes.applications.slice(0, 5);
          tbody.innerHTML = recent.map(app => `
            <tr>
              <td>
                <a href="/application-details.html?id=${app.application_id}" class="table-link" style="font-weight:700;">
                  ${app.application_id}
                </a>
                ${app.application_type === 'collective' ? '<span class="badge badge-collective" style="margin-left:4px;">Class</span>' : ''}
              </td>
              <td>${UI.escapeHtml(app.category)}</td>
              <td>
                <div style="font-weight:600;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                  ${UI.escapeHtml(app.subject)}
                </div>
              </td>
              <td>
                <div style="font-weight:500;">${UI.escapeHtml(app.recipient_designation || app.recipient_role.toUpperCase())}</div>
                ${app.recipient_name ? `<div style="font-size:.75rem;color:var(--text-secondary);">${UI.escapeHtml(app.recipient_name)}</div>` : ''}
              </td>
              <td>${UI.formatDate(app.submitted_at || app.created_at)}</td>
              <td>${UI.formatStatus(app.status)}</td>
              <td>
                <a href="/application-details.html?id=${app.application_id}" class="btn btn-sm btn-outline">
                  View Track →
                </a>
              </td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = `
            <tr>
              <td colspan="7">
                <div class="empty-state">
                  <div class="empty-icon">📂</div>
                  <div class="empty-title">No applications submitted yet</div>
                  <div class="empty-desc">Create your first digital application to submit it to your class coordinator, HOD, or director.</div>
                </div>
              </td>
            </tr>
          `;
        }
      } catch (err) {
        console.error('Failed to load applications', err);
      }
    });
  </script>
</body>
</html>
